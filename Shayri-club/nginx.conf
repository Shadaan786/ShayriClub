events {}

http {

  include /etc/nginx/mime.types;

  # set_real_ip_from        0.0.0.0/0;
  # real_ip_recursive       on;
  # real_ip_header          X-Forward-For;
  # limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  upstream backend{
    server alfaz-backend:4000;
  }

  server {
    listen 80;
    server_name alfaz.live www.alfaz.live;
    # server_token off;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://alfaz.live$request_uri;
    }
    # root /proxy;
    # limit_req zone=mylimit burst=70 nodelay;

    # root /usr/share/nginx/html;
    # index index.html;

    # location / {
    #         # root   /usr/share/nginx/html;
    #         # index  index.html index.htm;
    #         try_files $uri $url /index.html;   
    #     }

    # error_page   500 502 503 504  /50x.html;
    # location = /50x.html {
    #     root   /usr/share/nginx/html;
    # }
  }

  server{
    listen 443 ssl;
    server_name alfaz.live www.alfaz.live;

    ssl_certificate /etc/letsencrypt/live/alfaz.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alfaz.live/privkey.pem;

     root /usr/share/nginx/html;
    index index.html;

        location /api {
          proxy_pass http://backend;
    }

       location / {
            # root   /usr/share/nginx/html;
            # index  index.html index.htm;
            try_files $uri /index.html;   
        }
  }
}


